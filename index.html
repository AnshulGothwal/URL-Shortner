<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URLShortner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>URL Shortener</h1>
    <p>Shorten long URLs into shareable links</p>

    <div class="input-box">
        <input id="input" type="text" placeholder="Paste your long URL here...">
        
        <button id="button">Generate Short URL</button>
    </div>

    <div class="result">
        <h3>Your Short URL</h3>

        <div class="short-url">
            <span id="display"></span>
            <button id="copy">Copy</button>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
